# NanoVox controlled vocabularies.
#
# Everything the analysis is allowed to classify a call as. The model is
# constrained to these values, which is what makes the dashboard able to group
# and count them — free text produces a category of one.
#
# Changing this file changes classification. Adding a category also requires
# re-running the corpus so existing calls are re-classified against it.

version: "1.0.0"

# --- Call categories -------------------------------------------------------
# Seven categories come from Documents/call_corpus_v3_index.xlsx (DEC-02);
# copay and coverage_termination were added afterwards, for two topics the
# source index folded into Coverage & Benefits despite their needing different
# answers — what a visit costs, and whether the member still has a plan at all.
# life_beneficiary was added for the v6 corpus, which queues Life & Beneficiary
# separately and which the index had no home for at all.
#
# Note on "Broker Conduct" (code: broker_attributed): it is kept here because it
# is a category in the
# source index, but it overlaps the others by nature — a broker call is also an
# Enrollment or Coverage call. Broker involvement is additionally recorded as a
# broker signal, which is what the Broker Scorecard counts. The category is the
# member's topic; the signal is the attribution.
categories:
  - code: coverage_benefits
    label: Coverage & Benefits
    description: >-
      Whether something is covered at all, and how the plan is designed —
      exclusions, waiting periods, riders, eligibility for a benefit, prior
      authorisation. Use this only where no amount and no limit is in question;
      if the member wants to know what they will pay or how much of their
      benefit is left, that is copay, even when answering it means explaining
      the coverage.
  - code: claims_eob
    label: Claims & EOB
    description: Claim status, denials, explanations of benefits, appeals.
  - code: provider_network
    label: Provider Network
    description: In-network status, referrals, directory accuracy, access.
  - code: billing_premium
    label: Billing & Premium
    description: Invoices, premium changes, payments, refunds.
  - code: enrollment_id_cards
    label: Enrollment & ID Cards
    description: >-
      Getting people on and off the plan and identifying them once they are on
      it — enrolment, a qualifying life event such as a marriage, birth or a
      dependent ageing off, tier changes, ID cards and portal access. Where the
      life event concerns life cover or a beneficiary, use life_beneficiary
      instead. This category absorbed a third of the v6 corpus, so prefer a
      more specific one wherever it fits.
  - code: pharmacy
    label: Pharmacy
    description: >-
      Formulary, pharmacy prior authorisation, refills. Prescriptions stay here
      even when the question is what the drug costs.
  # The code stays 'copay' because it is stored on every call, but the code is
  # the problem: given a call about an annual maximum the model reads the name,
  # decides it is not about a copay, and files it under coverage_benefits. It
  # chose this category for 0 of 100 calls in the v6 run while 24 of them sat
  # in the Cost Share & Policy queue. So the label carries the breadth and the
  # description gives a rule that decides rather than a distinction that
  # describes.
  - code: copay
    label: Cost Share & Limits
    description: >-
      Any call that turns on an amount the member owes or a ceiling on what the
      plan pays: copay, coinsurance, deductible, annual maximum, a frequency
      limit, or what a course of treatment will cost them. This covers "why was
      I charged", "how much of my benefit is left", "what will this cost" and
      "why has my benefit run out" — a benefit exhausted for the year belongs
      here, whereas a policy that has ended is coverage_termination. Where the
      call is about both an amount and whether a
      service is covered, choose this one — explaining a benefit in order to
      answer a cost question is still a cost question.
  - code: coverage_termination
    label: Coverage Termination
    description: >-
      Coverage that has ended, lapsed or is about to — cancellation,
      non-payment, loss of eligibility, or a termination the member disputes.
      Use this when the member's plan itself is in question, not the benefit.
  # Added for v6, which carries a Life & Beneficiary queue the taxonomy had no
  # home for: all four of those calls were filed as enrollment_id_cards, which
  # put a death claim and a beneficiary designation beside tier changes and ID
  # card requests.
  - code: life_beneficiary
    label: Life & Beneficiary
    description: >-
      Life insurance and the people named on it — designating or changing a
      beneficiary, filing a death claim, converting or porting cover after
      leaving, changing a cover amount, or evidence of insurability. Use this
      for anything where the life policy or its beneficiaries is the subject,
      rather than enrollment_id_cards: adding life cover during a life event is
      still this category.
  # The code stays 'broker_attributed': it is stored on every call, so changing
  # it would orphan them. Only the label a person reads is renamed — "Attributed"
  # read as "a broker was named", which is the far larger broker-signal count,
  # not what this category counts.
  - code: broker_attributed
    label: Broker Conduct
    description: The member's issue originates with broker conduct or advice.

# --- L4 operational BI categories ------------------------------------------
# Each L4 insight is written against exactly one of these, with a named owner.
# Distribution across the corpus: process breakdown 25, broker attribution 19,
# member communication gap 11, compliance & risk 9, agent coaching 8,
# provider performance 2.
l4_categories:
  - code: process_breakdown
    label: Process Breakdown
    owner: { code: operations, name: Operations }
    default_severity: HIGH
    description: >-
      A step in the plan's own process failed or is missing — work not done,
      a handoff dropped, a record wrong, a system that could not answer. The
      agent handled it correctly and the process defeated them.
  - code: broker_attribution
    label: Broker Attribution
    owner: { code: broker_relations, name: Broker Relations }
    default_severity: HIGH
    description: >-
      The member's problem originates with what a broker told them, sold them
      or failed to do. Only where the member names the broker aloud; the same
      evidence rule as broker_signals.
  - code: member_communication_gap
    label: Member Communication Gap
    owner: { code: member_communications, name: Member Communications }
    default_severity: MEDIUM
    description: >-
      The member did not know something the plan should have told them — a
      benefit, a deadline, a cost, a rule. Nothing was done wrong on the call;
      the call should not have been needed.
  - code: compliance_risk
    label: Compliance & Risk
    owner: { code: compliance, name: Compliance }
    default_severity: CRITICAL
    description: >-
      A regulatory or legal exposure: a required disclosure omitted, a
      notification deadline missed, language access not offered, PHI handled
      wrongly, a clinical urgency not recognised, or advice given that the
      administrator is not permitted to give.
  - code: agent_coaching
    label: Agent Coaching
    owner: { code: call_centre_management, name: Call Centre Management }
    default_severity: MEDIUM
    description: >-
      Something the agent could have done differently — the process worked and
      the handling did not. Use this where a person needs coaching, and
      process_breakdown where coaching would be the wrong response.
  - code: provider_performance
    label: Provider Performance
    owner: { code: provider_relations, name: Provider Relations }
    default_severity: MEDIUM
    description: >-
      A doctor, dentist, pharmacy or clinic is the source of the problem —
      wrong information given to the member, a directory listing that is
      inaccurate, billing the member incorrectly, or refusing valid coverage.

# --- Signal types ----------------------------------------------------------
# Named conditions a call can raise. `clinical_risk` is referenced by a rubric
# gate; the loader checks that every gate argument names a signal defined here,
# so a rename cannot silently disable the safety rule.
signal_types:
  - code: clinical_risk
    label: Unrecognised clinical urgency
    severity: CRITICAL
    description: >-
      The caller describes a physical symptom, pain, an infection, bleeding,
      or a lapse in essential medication, and the agent answers the
      administrative question without recognising the clinical urgency or
      directing them to care. The test is the agent's non-response, not how
      serious the symptom sounds: a symptom the agent does route to care is
      handled correctly and raises nothing.
  - code: compliance_disclosure_missing
    label: Required disclosure omitted
    severity: HIGH
    description: >-
      A disclosure the administrator owes the caller was not made — call
      recording not disclosed, an appeal right not stated, a notice deadline
      not given, or the limits of what the administrator may advise not made
      clear. Raise it for the disclosure that is absent, not for an answer
      that was merely incomplete.
  - code: language_access
    label: Language access not provided
    severity: HIGH
    description: >-
      The caller cannot conduct the call in the language they need and is not
      offered an interpreter or a route to one. A request to find a provider
      who speaks a given language is a benefits question, not this: the caller
      is speaking English to the agent successfully.
  - code: repeat_contact
    label: Repeat contact on an unresolved issue
    severity: MEDIUM
    description: >-
      The caller says they have contacted the administrator about this same
      issue before and it is still not fixed. It must be their prior contact
      about the same matter — a caller who mentions a previous unrelated call,
      or who was told to call back and is doing so for the first time, is not
      a repeat contact.
  - code: broker_conduct
    label: Broker conduct concern
    severity: HIGH
    description: >-
      A named broker or agency is the source of the problem: they gave the
      caller wrong information, did not act, or are unreachable. A broker
      merely mentioned in passing, or one who did their job, does not raise
      this.
  - code: exemplar
    label: Exemplary handling worth replicating
    severity: LOW
    description: >-
      The agent did something another agent should be taught to copy — caught
      an error nobody asked about, checked the record instead of answering
      from memory, or prevented a cost the caller had not foreseen. Reserve it
      for handling worth quoting in training; a call that simply went well
      raises nothing.

# --- Sentiment vocabulary --------------------------------------------------
# The corpus contains 44 distinct arcs built from these states. Constraining both
# ends to this list is what allows arcs to be grouped on the dashboard.
sentiment_states:
  - NEUTRAL
  - CURIOUS
  - CONFUSED
  - WORRIED
  - ANXIOUS
  - FRUSTRATED
  - ANGRY
  - DISTRESSED
  - PANICKED
  - INFORMED
  - SATISFIED
  - REASSURED
  - RELIEVED
  - CALMED
  - POSITIVE
  - PARTIALLY_SATISFIED
  - PARTIALLY_HELPED
  - PARTIALLY_REASSURED
  - PARTIALLY_CALMED
  - RESIGNED
  - DISMISSED
  - ABANDONED
  - ESCALATED
  - ALARMED
