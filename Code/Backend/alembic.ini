# Alembic configuration.
#
# The database URL is deliberately absent: env.py reads it from the application
# settings so there is exactly one source of truth for it (D4). Logging is
# likewise configured by the application, not by this file.

[alembic]
script_location = infrastructure/persistence/migrations
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC
